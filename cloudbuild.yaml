###############################################################################
# cloudbuild.yaml
# Triggered on push to the configured branch.
# Substitutions injected by Terraform:
#   $_PROJECT_ID, $_SECURITY_POLICY, $_REGION, $_TF_STATE_BUCKET, $_ENV
###############################################################################

timeout: "1800s"   # 30-minute build timeout

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: "E2_HIGHCPU_8"
  env:
    - "TF_VAR_project_id=$_PROJECT_ID"
    - "TF_VAR_security_policy_name=$_SECURITY_POLICY"
    - "TF_VAR_region=$_REGION"
    - "TF_VAR_environment=$_ENV"

substitutions:
  _PROJECT_ID: "my-gcp-project-id"         # overridden by Terraform trigger
  _SECURITY_POLICY: "cloud-armor-waf-policy"
  _REGION: "us-central1"
  _TF_STATE_BUCKET: "my-gcp-project-id-tfstate"
  _ENV: "prod"
  _TF_VERSION: "1.7.5"

steps:

  # ────────────────────────────────────────────────────────────────────────────
  # Step 0: Print environment info (helpful for debugging)
  # ────────────────────────────────────────────────────────────────────────────
  - id: "env-info"
    name: "alpine"
    entrypoint: "sh"
    args:
      - "-c"
      - |
        echo "====================================="
        echo " Cloud Armor Deployment Pipeline"
        echo "====================================="
        echo "Project   : $_PROJECT_ID"
        echo "Policy    : $_SECURITY_POLICY"
        echo "Region    : $_REGION"
        echo "Env       : $_ENV"
        echo "Branch    : $BRANCH_NAME"
        echo "Commit    : $SHORT_SHA"
        echo "====================================="

  # ────────────────────────────────────────────────────────────────────────────
  # Step 1: Install Terraform
  # ────────────────────────────────────────────────────────────────────────────
  - id: "install-terraform"
    name: "hashicorp/terraform:$_TF_VERSION"
    entrypoint: "sh"
    args:
      - "-c"
      - |
        terraform version
        echo "Terraform $_TF_VERSION ready."

  # ────────────────────────────────────────────────────────────────────────────
  # Step 2: Terraform fmt check
  # ────────────────────────────────────────────────────────────────────────────
  - id: "terraform-fmt"
    name: "hashicorp/terraform:$_TF_VERSION"
    entrypoint: "sh"
    dir: "terraform"
    args:
      - "-c"
      - |
        echo ">>> Checking Terraform formatting..."
        terraform fmt -check -recursive
        echo ">>> Format check passed."

  # ────────────────────────────────────────────────────────────────────────────
  # Step 3: Terraform init (with GCS backend)
  # ────────────────────────────────────────────────────────────────────────────
  - id: "terraform-init"
    name: "hashicorp/terraform:$_TF_VERSION"
    entrypoint: "sh"
    dir: "terraform"
    args:
      - "-c"
      - |
        echo ">>> Initialising Terraform..."
        terraform init \
          -backend-config="bucket=$_TF_STATE_BUCKET" \
          -backend-config="prefix=cloud-armor/$_ENV/state" \
          -input=false \
          -no-color
        echo ">>> Init complete."

  # ────────────────────────────────────────────────────────────────────────────
  # Step 4: Terraform validate
  # ────────────────────────────────────────────────────────────────────────────
  - id: "terraform-validate"
    name: "hashicorp/terraform:$_TF_VERSION"
    entrypoint: "sh"
    dir: "terraform"
    args:
      - "-c"
      - |
        echo ">>> Validating Terraform configuration..."
        terraform validate -no-color
        echo ">>> Validation passed."

  # ────────────────────────────────────────────────────────────────────────────
  # Step 5: tfsec — static security scanning
  # ────────────────────────────────────────────────────────────────────────────
  - id: "tfsec-scan"
    name: "aquasec/tfsec:latest"
    entrypoint: "sh"
    dir: "terraform"
    args:
      - "-c"
      - |
        echo ">>> Running tfsec security scan..."
        tfsec . \
          --no-color \
          --minimum-severity HIGH \
          --exclude-downloaded-modules || true
        echo ">>> tfsec scan complete."

  # ────────────────────────────────────────────────────────────────────────────
  # Step 6: Terraform plan — save plan to GCS
  # ────────────────────────────────────────────────────────────────────────────
  - id: "terraform-plan"
    name: "hashicorp/terraform:$_TF_VERSION"
    entrypoint: "sh"
    dir: "terraform"
    args:
      - "-c"
      - |
        echo ">>> Generating Terraform plan..."
        terraform plan \
          -var="project_id=$_PROJECT_ID" \
          -var="security_policy_name=$_SECURITY_POLICY" \
          -var="region=$_REGION" \
          -var="environment=$_ENV" \
          -out=tfplan \
          -no-color \
          -input=false
        echo ">>> Plan generated: tfplan"

  # ────────────────────────────────────────────────────────────────────────────
  # Step 7: Upload plan artifact to GCS
  # ────────────────────────────────────────────────────────────────────────────
  - id: "upload-plan"
    name: "gcr.io/cloud-builders/gsutil"
    entrypoint: "sh"
    dir: "terraform"
    args:
      - "-c"
      - |
        echo ">>> Uploading plan to GCS..."
        gsutil cp tfplan \
          gs://$_TF_STATE_BUCKET/cloud-armor/$_ENV/plans/tfplan-$SHORT_SHA
        echo ">>> Plan uploaded."

  # ────────────────────────────────────────────────────────────────────────────
  # Step 8: Terraform apply (only on main/master branch)
  # ────────────────────────────────────────────────────────────────────────────
  - id: "terraform-apply"
    name: "hashicorp/terraform:$_TF_VERSION"
    entrypoint: "sh"
    dir: "terraform"
    args:
      - "-c"
      - |
        if [ "$BRANCH_NAME" = "main" ] || [ "$BRANCH_NAME" = "master" ]; then
          echo ">>> Applying Terraform plan on branch: $BRANCH_NAME ..."
          terraform apply \
            -auto-approve \
            -input=false \
            -no-color \
            tfplan
          echo ">>> Apply complete."
        else
          echo ">>> Skipping apply — not on main/master (branch: $BRANCH_NAME)"
        fi

  # ────────────────────────────────────────────────────────────────────────────
  # Step 9: Verify Cloud Armor policy was created/updated
  # ────────────────────────────────────────────────────────────────────────────
  - id: "verify-policy"
    name: "gcr.io/cloud-builders/gcloud"
    entrypoint: "sh"
    args:
      - "-c"
      - |
        if [ "$BRANCH_NAME" = "main" ] || [ "$BRANCH_NAME" = "master" ]; then
          echo ">>> Verifying Cloud Armor policy..."
          gcloud compute security-policies describe $_SECURITY_POLICY \
            --project=$_PROJECT_ID \
            --format="table(name,description,fingerprint)"
          echo ""
          echo ">>> Rules in policy:"
          gcloud compute security-policies rules list \
            --security-policy=$_SECURITY_POLICY \
            --project=$_PROJECT_ID \
            --format="table(priority,action,description)"
          echo ">>> Verification complete."
        else
          echo ">>> Skipping verification — not on main/master."
        fi

  # ────────────────────────────────────────────────────────────────────────────
  # Step 10: Terraform output — print key values
  # ────────────────────────────────────────────────────────────────────────────
  - id: "terraform-output"
    name: "hashicorp/terraform:$_TF_VERSION"
    entrypoint: "sh"
    dir: "terraform"
    args:
      - "-c"
      - |
        if [ "$BRANCH_NAME" = "main" ] || [ "$BRANCH_NAME" = "master" ]; then
          echo ">>> Terraform outputs:"
          terraform output -no-color
        fi

# ────────────────────────────────────────────────────────────────────────────
# Artifacts: store Terraform plan logs in GCS
# ────────────────────────────────────────────────────────────────────────────
artifacts:
  objects:
    location: "gs://$_TF_STATE_BUCKET/cloud-armor/$_ENV/build-logs/"
    paths:
      - "terraform/tfplan"
